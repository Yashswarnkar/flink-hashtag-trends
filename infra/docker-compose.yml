# Phase 0 stack: Kafka (KRaft) -> Flink (1 JobManager + 2 TaskManagers) -> Redis.
# Memory is capped per container so the whole stack fits comfortably in the 8 GiB VM.
# Later phases add MinIO (checkpoints), Prometheus/Grafana, generator and API.

x-flink-common: &flink-common
  image: flink:2.2.1-java17

x-flink-props: &flink-props |
  jobmanager.rpc.address: jobmanager
  jobmanager.memory.process.size: 1024m
  taskmanager.memory.process.size: 1280m
  taskmanager.numberOfTaskSlots: 2
  parallelism.default: 2
  rest.flamegraph.enabled: true
  # Explicit so failure behaviour is visible and predictable (see docs/00).
  restart-strategy.type: exponential-delay

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: hashtags-kraft-cluster-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT: used by Flink inside the Docker network.
      # EXTERNAL:  used by tools on the Mac (generator) via Lima's port forward.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  jobmanager:
    <<: *flink-common
    hostname: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: *flink-props
    mem_limit: 1152m
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Two named TaskManagers (not `replicas: 2`) so scenarios can target one by name,
  # e.g. `docker kill hashtags-taskmanager-2-1` to simulate a machine dying.
  taskmanager-1:
    <<: *flink-common
    hostname: taskmanager-1
    command: taskmanager
    depends_on:
      jobmanager: { condition: service_healthy }
    environment:
      # Same base config + a readable id/host so the Flink UI shows "taskmanager-1".
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: 2
        taskmanager.host: taskmanager-1
        taskmanager.resource-id: taskmanager-1
    mem_limit: 1408m

  taskmanager-2:
    <<: *flink-common
    hostname: taskmanager-2
    command: taskmanager
    depends_on:
      jobmanager: { condition: service_healthy }
    environment:
      # Same base config + a readable id/host so the Flink UI shows "taskmanager-2".
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: 2
        taskmanager.host: taskmanager-2
        taskmanager.resource-id: taskmanager-2
    mem_limit: 1408m

  redis:
    image: redis:8.6.7-alpine
    hostname: redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kafka-data:
